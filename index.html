<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-96.png"><title>Elite TCG Product Finder</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#050505;color:#f5f0e6}.wrap{max-width:980px;margin:auto;padding:16px}.hero{padding:16px 2px 8px}.hero h1{margin:0;font-size:28px}.hero p,.muted{color:#c8b16c}.panel,.card,.modalbox{background:linear-gradient(145deg,#111,#080808);border:1px solid #9b7728;border-radius:16px}.panel{padding:13px;margin:10px 0}input,select{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid #8d6d25;background:#090909;color:#f8f2df}.filters,.calcgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.stats{color:#c8b16c;font-size:13px;margin:12px 2px}.card{padding:14px;margin:10px 0;cursor:pointer;transition:.15s}.card:active{transform:scale(.99)}.top{display:flex;justify-content:space-between;gap:12px}.name{font-weight:800;font-size:17px}.set{color:#c8b16c;font-size:13px}.price{font-size:21px;font-weight:850;white-space:nowrap}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pill{font-size:12px;padding:5px 8px;border-radius:999px;background:linear-gradient(145deg,#3b2c0d,#171207)}.up{background:#49370f;color:#f6d56a}.released{background:#263014;color:#d9e6a6}.details{margin-top:9px;color:#d6c99e;font-size:14px}.good{color:#7ee2ad}.bad{color:#ff9c9c}.neutral{color:#ffd978}.arrow{color:#d4af37;font-weight:800}.result{font-size:17px;font-weight:700;margin-top:10px}.footer{text-align:center;color:#71839d;padding:26px 0}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;padding:14px;overflow:auto}.modal.show{display:flex;align-items:flex-start;justify-content:center}.modalbox{width:min(680px,100%);margin-top:5vh;padding:18px}.close{float:right;background:#171717;color:#f4d978}.btn,a.btn{display:inline-block;border:0;border-radius:10px;padding:11px 13px;font-weight:750;background:linear-gradient(135deg,#8a6720,#d4af37,#f2d675,#a47b25);color:#080808;text-decoration:none;margin:5px 5px 0 0}.secondary{background:#171717!important;color:#e3c35b!important}.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shop{border:1px solid #8d6d25;border-radius:12px;padding:11px;background:#090909}.shop b{display:block}.warning{border-left:3px solid #ffd978;padding-left:10px}.watch{margin-top:12px}.watch.on{background:#263014;color:#d9e6a6}.chartbox{margin-top:10px;padding:10px;border:1px solid #8d6d25;border-radius:12px;background:#070707}.chartbox svg{width:100%;height:190px;display:block}.trendgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.trendstat{border:1px solid #6d531c;border-radius:10px;padding:9px;background:#090909}.trendstat span{display:block;color:#c8b16c;font-size:12px}.trendstat b{font-size:16px}.ranges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.rangebtn{padding:7px 10px;border:1px solid #6d531c;border-radius:999px;background:#111;color:#d7b64e;font-weight:700}.rangebtn.active{background:#d4af37;color:#080808}.marketline{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:8px 0}.marketbig{font-size:28px;font-weight:900;color:#e0bd55}.tiny{font-size:11px;color:#8f825d}.sectiontitle{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#c9ad5a;margin:18px 0 7px}@media(max-width:600px){.filters,.calcgrid,.shopgrid{grid-template-columns:1fr}.price{font-size:18px}}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -20%,rgba(212,175,55,.10),transparent 42%);z-index:-1}.hero h1{background:linear-gradient(90deg,#8f6b20,#f4dc83,#b88928);-webkit-background-clip:text;background-clip:text;color:transparent}.card:hover{border-color:#d4af37;box-shadow:0 0 0 1px #6d531c,0 8px 24px #0008}.price{color:#e0bd55}.panel b,.sectiontitle{color:#d7b64e}</style></head><body><div class="wrap">
<div class="hero"><h1>Elite TCG Product Finder</h1><p>Pokémon TCG products • Canadian MSRP • retailer finder • deal check</p></div>
<div class="panel"><input id="q" placeholder="Search: 30th, ETB, Greninja, booster…" autofocus><div class="filters"><select id="status"><option value="">All release statuses</option><option>Released</option><option>Upcoming</option></select><select id="type"><option value="">All product types</option></select></div></div>
<div class="panel"><b>Private Sale / Deal Check</b><div class="calcgrid"><input id="msrp" inputmode="decimal" placeholder="Retail/MSRP $"><input id="ask" inputmode="decimal" placeholder="Seller asking $"></div><div id="calcResult" class="result"></div></div>
<div id="stats" class="stats"></div><div id="list"></div><div class="footer">CAD pricing • Tap any product for retailer links • Verify inventory before travelling</div></div>
<div id="modal" class="modal"><div class="modalbox"><button class="btn close" onclick="closeModal()">Close</button><div id="modalContent"></div></div></div>
<script src="products.js"></script><script>
const RETAILERS=[
{name:"Pokémon Center Canada",url:"https://www.pokemoncenter.com/en-ca/search/pokemon-tcg",kind:"Official"},
{name:"Walmart Canada",url:"https://www.walmart.ca/search?q=pokemon%20tcg",kind:"Retail + Marketplace"},
{name:"GameStop Canada",url:"https://www.gamestop.ca/SearchResult/QuickSearch?q=pokemon+tcg",kind:"Retail"},
{name:"Best Buy Canada",url:"https://www.bestbuy.ca/en-ca/search?search=pokemon%20tcg",kind:"Retail + Marketplace"},
{name:"London Drugs",url:"https://www.londondrugs.com/search/?q=pokemon",kind:"Retail"},
{name:"Canadian Tire",url:"https://www.canadiantire.ca/en/search-results.html?q=pokemon%20cards",kind:"Retail"},
{name:"Toys R Us Canada",url:"https://www.toysrus.ca/en/search?q=pokemon%20cards",kind:"Retail"}
];
const q=document.querySelector('#q'),status=document.querySelector('#status'),type=document.querySelector('#type'),list=document.querySelector('#list'),stats=document.querySelector('#stats'),modal=document.querySelector('#modal'),modalContent=document.querySelector('#modalContent');
[...new Set(PRODUCTS.map(x=>x.type))].sort().forEach(v=>{let o=document.createElement('option');o.textContent=v;type.appendChild(o)});
const effectiveStatus=x=>new Date(x.release+'T23:59:59')<new Date()?'Released':x.status;
const money=n=>n==null?'TBA':new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function deal(x){if(x.observed==null||x.msrp==null)return '';let r=x.observed/x.msrp;return '<span class="'+(r<=1?'good':r<=1.15?'neutral':'bad')+'">'+(r<=1?'at/below MSRP':r<=1.15?'near MSRP':'over MSRP')+'</span>'}
function render(){let s=q.value.toLowerCase().trim();let arr=PRODUCTS.filter(x=>(!s||(x.set+' '+x.product+' '+x.type).toLowerCase().includes(s))&&(!status.value||effectiveStatus(x)===status.value)&&(!type.value||x.type===type.value));stats.textContent=arr.length+' matching products • '+PRODUCTS.length+' in database';list.innerHTML=arr.map(x=>{let i=PRODUCTS.indexOf(x);return '<div class="card" onclick="openProduct('+i+')"><div class="top"><div><div class="name">'+esc(x.product)+'</div><div class="set">'+esc(x.set)+'</div></div><div class="price">'+money(x.msrp)+'</div></div><div class="meta"><span class="pill '+(effectiveStatus(x)==='Upcoming'?'up':'released')+'">'+esc(effectiveStatus(x))+'</span><span class="pill">'+esc(x.type)+'</span><span class="pill">'+esc(x.release)+'</span></div>'+(x.observed!=null?'<div class="details">Observed asking price: <b>'+money(x.observed)+'</b> '+deal(x)+'</div>':'')+'<div class="details arrow">Tap for product details & retailer finder →</div></div>'}).join('')||'<div class="card">No matching products.</div>'}
function retailerLink(r,x){let query=encodeURIComponent(x.product);if(r.name==='Walmart Canada')return 'https://www.walmart.ca/search?q='+query;if(r.name==='Best Buy Canada')return 'https://www.bestbuy.ca/en-ca/search?search='+query;if(r.name==='GameStop Canada')return 'https://www.gamestop.ca/SearchResult/QuickSearch?q='+query;if(r.name==='Canadian Tire')return 'https://www.canadiantire.ca/en/search-results.html?q='+query;return r.url}
function priceHistory(x){let all=JSON.parse(localStorage.getItem('elitePriceHistory')||'{}'),k=x.set+'|'+x.product,h=all[k]||[];if(x.observed!=null){let d=new Date().toISOString().slice(0,10),last=h[h.length-1];if(!last||last.date!==d||last.price!==x.observed){h.push({date:d,price:x.observed});h=h.slice(-365);all[k]=h;localStorage.setItem('elitePriceHistory',JSON.stringify(all))}}return h}
function filteredHistory(x,days){let h=priceHistory(x);if(days===0)return h;let cut=Date.now()-days*86400000;return h.filter(v=>new Date(v.date+'T12:00:00').getTime()>=cut)}
function trendHTML(x,days=30){let h=filteredHistory(x,days),all=priceHistory(x);if(!all.length)return '<p class="muted">No market-price observations recorded yet.</p>';if(!h.length)h=all.slice(-1);let first=h[0].price,last=h[h.length-1].price,chg=first?((last-first)/first*100):0,hi=Math.max(...h.map(v=>v.price)),lo=Math.min(...h.map(v=>v.price)),ms=x.msrp,vs=ms?((last-ms)/ms*100):null;let cls=chg>0?'good':chg<0?'bad':'neutral',vscls=vs==null?'neutral':vs<=0?'good':'bad';let chart='';if(h.length>1){let w=600,hh=180,p=16,min=Math.min(lo,ms??lo),max=Math.max(hi,ms??hi),range=max-min||1;let pts=h.map((v,i)=>((p+i*(w-2*p)/(h.length-1))+','+(p+(max-v.price)*(hh-2*p)/range))).join(' ');let msline=ms!=null?'<line x1="16" y1="'+(p+(max-ms)*(hh-2*p)/range)+'" x2="584" y2="'+(p+(max-ms)*(hh-2*p)/range)+'" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/><text x="20" y="'+Math.max(12,(p+(max-ms)*(hh-2*p)/range)-5)+'" fill="#aaa" font-size="12">MSRP '+money(ms)+'</text>':'';chart='<div class="chartbox"><svg viewBox="0 0 600 180" preserveAspectRatio="none">'+msline+'<polyline fill="none" stroke="#d4af37" stroke-width="4" points="'+pts+'"/></svg><div class="muted">'+esc(h[0].date)+' → '+esc(h[h.length-1].date)+' • '+h.length+' observations</div></div>'}else chart='<div class="chartbox muted">Only one observation exists in this range. More snapshots will build the chart.</div>';let ranges=[[7,'7D'],[30,'30D'],[90,'90D'],[365,'1Y'],[0,'ALL']].map(r=>'<button class="rangebtn '+(days===r[0]?'active':'')+'" onclick="event.stopPropagation();setTrendRange('+PRODUCTS.indexOf(x)+','+r[0]+')">'+r[1]+'</button>').join('');return '<div class="marketline"><div><div class="tiny">LATEST OBSERVED MARKET</div><div class="marketbig">'+money(last)+'</div></div><div class="'+vscls+'">'+(vs==null?'MSRP unavailable':(vs>=0?'+':'')+vs.toFixed(1)+'% vs MSRP')+'</div></div><div class="ranges">'+ranges+'</div><div class="trendgrid"><div class="trendstat"><span>Period change</span><b class="'+cls+'">'+(chg>=0?'+':'')+chg.toFixed(1)+'%</b></div><div class="trendstat"><span>Period low</span><b>'+money(lo)+'</b></div><div class="trendstat"><span>Period high</span><b>'+money(hi)+'</b></div></div>'+chart}
let currentTrendRange=30;function setTrendRange(i,d){currentTrendRange=d;openProduct(i)}
function watched(x){return JSON.parse(localStorage.getItem('eliteWatch')||'[]').includes(x.product)}
function toggleWatch(i){let x=PRODUCTS[i],w=JSON.parse(localStorage.getItem('eliteWatch')||'[]');w=w.includes(x.product)?w.filter(v=>v!==x.product):[...w,x.product];localStorage.setItem('eliteWatch',JSON.stringify(w));openProduct(i)}
function openProduct(i){let x=PRODUCTS[i];modalContent.innerHTML='<h2>'+esc(x.product)+'</h2><div class="muted">'+esc(x.set)+' • '+esc(x.type)+' • '+esc(x.release)+'</div><div class="sectiontitle">Canadian reference</div><div class="shopgrid"><div class="shop"><span class="muted">MSRP / retail reference</span><b class="price">'+money(x.msrp)+'</b></div><div class="shop"><span class="muted">Observed asking price</span><b class="price">'+money(x.observed)+'</b>'+deal(x)+'</div></div>'+(x.notes?'<p>'+esc(x.notes)+'</p>':'')+'<div class="sectiontitle">Market price tracker</div>'+trendHTML(x,currentTrendRange)+'<p class="muted">Tracks the app’s recorded observed-market price over time on this device. As market-price observations update, this builds a stock-style history chart.</p><div class="sectiontitle">Find this product</div><p class="muted">These buttons search the retailer for this exact product. Stock is only considered confirmed when the retailer itself shows it available.</p><div class="shopgrid">'+RETAILERS.map(r=>'<div class="shop"><b>'+r.name+'</b><span class="muted">'+r.kind+'</span><br><a class="btn" target="_blank" rel="noopener" href="'+retailerLink(r,x)+'">Check retailer</a></div>').join('')+'</div><p class="warning muted"><b>Marketplace warning:</b> Walmart and Best Buy may show third-party sellers. Check “sold and shipped by” before treating a listing as retail stock.</p><button class="btn watch '+(watched(x)?'on':'')+'" onclick="toggleWatch('+i+')">'+(watched(x)?'★ Watching product':'☆ Add to watchlist')+'</button><p class="muted">The in-app watchlist is saved on this device. Your separate 30th Celebration stock monitor continues to handle automated alerts.</p>';modal.classList.add('show')}
function closeModal(){modal.classList.remove('show')}modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
[q,status,type].forEach(e=>e.addEventListener('input',render));render();
function calc(){let m=parseFloat(msrp.value),a=parseFloat(ask.value);if(!m||isNaN(a)){calcResult.textContent='';return}let d=a-m,p=d/m*100;calcResult.innerHTML=d===0?'<span class="good">Exactly MSRP</span>':d<0?'<span class="good">'+money(Math.abs(d))+' below retail ('+Math.abs(p).toFixed(1)+'% under)</span>':'<span class="bad">'+money(d)+' above retail ('+p.toFixed(1)+'% over)</span>'}msrp.oninput=ask.oninput=calc;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
