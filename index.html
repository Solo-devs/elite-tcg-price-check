<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="96x96" href="icon-96.png"><title>Elite TCG Price Check</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1220;color:#eef2ff}.wrap{max-width:920px;margin:auto;padding:18px}.hero{padding:20px 0}.hero h1{margin:0;font-size:28px}.hero p{color:#aebbd1}.search,.calc{background:#131e30;border:1px solid #273750;border-radius:16px;padding:14px;margin:12px 0}input,select{width:100%;font-size:17px;padding:13px;border-radius:10px;border:1px solid #3b4b63;background:#0c1524;color:white}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.stats{color:#9fb0c8;font-size:14px;margin:12px 2px}.card{background:#131e30;border:1px solid #273750;border-radius:15px;padding:14px;margin:10px 0}.top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:750;font-size:17px}.set{color:#9fb0c8;font-size:13px}.price{font-size:22px;font-weight:800;white-space:nowrap}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pill{font-size:12px;padding:5px 8px;border-radius:999px;background:#25344b}.up{background:#4c3d16;color:#ffe79c}.released{background:#173d31;color:#b7f7dd}.details{margin-top:10px;color:#bdc8d9;font-size:14px}.good{color:#7ee2ad}.bad{color:#ff9c9c}.neutral{color:#ffd978}.calcgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.result{font-size:18px;font-weight:700;margin-top:10px}.small{font-size:12px;color:#8fa1ba}.footer{text-align:center;color:#71839d;padding:30px 0}button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;background:#e8b44b;color:#16120a}@media(max-width:600px){.filters,.calcgrid{grid-template-columns:1fr}.price{font-size:19px}}
</style></head><body><div class="wrap"><div class="hero"><h1>Elite TCG Price Check</h1><p>Canadian Pokémon TCG MSRP & private-sale quick reference.</p></div>
<div class="search"><input id="q" placeholder="Search: 30th, ETB, Greninja, booster…" autofocus><div class="filters"><select id="status"><option value="">All release statuses</option><option>Released</option><option>Upcoming</option></select><select id="type"><option value="">All product types</option></select></div></div>
<div class="calc"><b>Private Sale Calculator</b><div class="calcgrid" style="margin-top:9px"><input id="msrp" inputmode="decimal" placeholder="Retail/MSRP $"><input id="ask" inputmode="decimal" placeholder="Seller asking $"></div><div id="calcResult" class="result"></div></div>
<div id="stats" class="stats"></div><div id="list"></div><div class="footer">Prices in CAD • Verify current stock/seller before traveling</div></div><script src="products.js"></script><script>
const q=document.querySelector('#q'), status=document.querySelector('#status'), type=document.querySelector('#type'), list=document.querySelector('#list'), stats=document.querySelector('#stats');
[...new Set(PRODUCTS.map(x=>x.type))].sort().forEach(v=>{let o=document.createElement('option');o.textContent=v;type.appendChild(o)});
function money(n){return n==null?'TBA':new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n)}
function render(){let s=q.value.toLowerCase().trim();let arr=PRODUCTS.filter(x=>(!s||(x.set+' '+x.product+' '+x.type).toLowerCase().includes(s))&&(!status.value||x.status===status.value)&&(!type.value||x.type===type.value));stats.textContent=`${arr.length} matching products • ${PRODUCTS.length} in database`;list.innerHTML=arr.map(x=>`<div class="card"><div class="top"><div><div class="name">${x.product}</div><div class="set">${x.set}</div></div><div class="price">${money(x.msrp)}</div></div><div class="meta"><span class="pill ${x.status==='Upcoming'?'up':'released'}">${x.status}</span><span class="pill">${x.type}</span><span class="pill">${x.release}</span></div>${x.observed!=null?`<div class="details">Observed specialty/online: <b>${money(x.observed)}</b> ${x.msrp?`<span class="${x.observed<=x.msrp?'good':x.observed<=x.msrp*1.15?'neutral':'bad'}">(${x.observed<=x.msrp?'at/below':x.observed<=x.msrp*1.15?'near':'over'} MSRP)</span>`:''}</div>`:''}${x.notes?`<div class="details">${x.notes}</div>`:''}</div>`).join('')||'<div class="card">No matching products.</div>'}
[q,status,type].forEach(e=>e.addEventListener('input',render));render();
function calc(){let m=parseFloat(msrp.value),a=parseFloat(ask.value);if(!m||isNaN(a)){calcResult.textContent='';return}let d=a-m,p=d/m*100;calcResult.innerHTML=d===0?'<span class="good">Exactly MSRP</span>':d<0?`<span class="good">${money(Math.abs(d))} below retail (${Math.abs(p).toFixed(1)}% under)</span>`:`<span class="bad">${money(d)} above retail (${p.toFixed(1)}% over)</span>`}msrp.oninput=ask.oninput=calc;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
